name: check

# The fork's checks (FORK.md): unit tests and the static checks. The browser harness runs on macOS by hand.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    if: github.repository != 'chenglou/pretext'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test --parallel
      - run: bun run check
      - run: bun run package-smoke-test
